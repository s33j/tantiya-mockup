name: Backup

# Supabase Free has no backups, so this dumps prod every night.
on:
  schedule:
    # 18:00 UTC = 02:00 PHT.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  dump:
    # Pinned: ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installs the Supabase CLI at the version pinned in package.json.
      - run: pnpm install --frozen-lockfile

      # Roles, schema and data, as in Supabase's CLI backup guide.
      - name: Dump prod
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          mkdir backup
          pnpm supabase db dump --db-url "$PROD_DB_URL" --role-only -f backup/roles.sql
          pnpm supabase db dump --db-url "$PROD_DB_URL" -f backup/schema.sql
          pnpm supabase db dump --db-url "$PROD_DB_URL" --data-only --use-copy -f backup/data.sql

      - uses: actions/upload-artifact@v7
        with:
          name: prod-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

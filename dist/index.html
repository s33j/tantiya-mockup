/* Tantiya clickable mockup.
   Tokens from the proposal: ink navy #0F1B2D, teal #14B8A6 actions, blue = Yes/first outcome,
   orange = No/second, IBM Plex Sans with tabular numerals, radius 12 cards / 8 inputs.
   Derived tokens (surface, border, muted, status hexes) follow the token sheet and core mockups. */
:root{
  --bg:#0F1B2D; --deep:#0B1626; --page:#08111e; --surface:#16263D; --surface2:#1b2d47;
  --border:#24364F; --border2:#3A4E6B; --text:#E8EDF3; --text2:#C5D0DC; --muted:#9AA8BA;
  --teal:#14B8A6; --tealt:#2DD4BF; --blue:#60A5FA; --bluet:#93C5FD; --orange:#FB923C; --oranget:#FDBA74;
  --green:#4ADE80; --amber:#FCD34D; --grey:#9AA8BA;
  --r:12px; --ri:8px;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--tealt)}
:focus-visible{outline:2px solid var(--tealt);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .t2{color:var(--text2)} .small{font-size:14px} .xs{font-size:12px}
.b{font-weight:600} .bb{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- presenter page ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 20px;background:#0a1525;border-bottom:1px solid var(--border)}
.wm{font-weight:700;font-size:18px;letter-spacing:.2px}
.wm small{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav button{border:0;background:none;padding:8px 12px;border-radius:var(--ri);color:var(--text2);font-size:14px;min-height:36px}
.topnav button[aria-current=page]{background:var(--surface);color:var(--text);font-weight:600}
.top .grow{flex:1}
.persona{font-size:12px;color:var(--muted)}

@media(max-width:760px){.stage{grid-template-columns:minmax(0,1fr)}.rail{order:2}.notes{order:3}}
.rail,.notes{background:#0d1a2c;border:1px solid var(--border);border-radius:var(--r);padding:14px}
.rail h2,.notes h2{font-size:14px;font-weight:600;margin-bottom:8px}

.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}

.rail li button .sid{color:var(--muted);font-size:12px;min-width:34px;padding-top:2px}
.rail li button[aria-current=step]{background:var(--surface);color:var(--text)}
.rail .hint{font-size:12px;color:var(--muted);margin-top:10px}
.notes .sid{font-size:12px;color:var(--muted)}
.notes h3{font-size:16px;font-weight:600;margin:2px 0 8px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid var(--border2);color:var(--text2)}
.tag.new{border-color:var(--tealt);color:var(--tealt)} .tag.chg{border-color:var(--bluet);color:var(--bluet)}
.notes ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--text2);display:flex;flex-direction:column;gap:6px}
.notes .mc{color:var(--amber)}
.fitbox{display:flex;justify-content:center}
.fit{position:relative}
.fit>.dev{position:absolute;left:0;top:0;transform-origin:0 0}

/* phone device */
.phone{width:410px;height:864px;padding:10px;border-radius:52px;background:#050b14;box-shadow:0 0 0 1px #24364f,0 30px 60px rgba(0,0,0,.45)}
.screen{position:relative;width:390px;height:844px;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
/* desktop device */
.desk{width:1280px;height:800px;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--border2);box-shadow:0 30px 60px rgba(0,0,0,.45);display:flex;flex-direction:column}
.deskbar{height:32px;flex:none;background:#0a1525;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--muted)}
.deskbar i{width:10px;height:10px;border-radius:50%;background:#24364f;display:inline-block}
.deskbar span{margin-left:12px;background:var(--deep);border-radius:6px;padding:2px 12px}
.staffnotes{max-width:1280px;margin:0 auto;width:100%}

/* ---------- start screen ---------- */
.start{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.start h1{font-size:32px;line-height:1.1;font-weight:700;text-wrap:balance}
.start .lead{color:var(--text2);max-width:70ch;margin-top:10px}
.start .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.start .facts span{font-size:12px;border:1px solid var(--border2);border-radius:999px;padding:2px 10px;color:var(--text2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:24px}
.fcard{background:#0d1a2c;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.fcard .fn{font-size:12px;color:var(--muted)}
.fcard h2{font-size:18px;font-weight:600}
.fcard p{font-size:14px;color:var(--text2)}
.fcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.fcard .lvl{font-size:12px;color:var(--muted)}
.strip{margin-top:28px}
.strip h2{font-size:18px;font-weight:600;margin-bottom:4px}
.strip .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none}
.btn.p{background:var(--teal);color:#06231f}
.btn.s{background:none;border-color:var(--border2);color:var(--text)}
.btn.g{background:none;color:var(--tealt);padding:0 8px}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:var(--ri)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{background:none;border-color:var(--oranget);color:var(--oranget)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.chip svg{flex:none}
.chip.open{background:rgba(74,222,128,.14);color:var(--green)}
.chip.closing{background:rgba(252,211,77,.14);color:var(--amber)}
.chip.closed,.chip.paused,.chip.waiting,.chip.void{background:rgba(154,168,186,.16);color:var(--text2)}
.chip.neutral{background:var(--surface2);color:var(--text2)}
.chip.teal{background:rgba(45,212,191,.14);color:var(--tealt)}
.pill{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:999px;padding:6px 12px;font-size:14px;background:none;color:var(--text2);white-space:nowrap;min-height:36px}
.pill[aria-pressed=true]{background:var(--surface2);border-color:var(--tealt);color:var(--text)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills>*{flex:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block;color:inherit}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:15px;font-weight:700;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.kv>span:first-child{color:var(--text2)} .kv>span:last-child{font-weight:600;text-align:right}
.hr{height:1px;background:var(--border);margin:6px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--text2)}
.inp{width:100%;min-height:44px;background:var(--deep);border:1px solid var(--border2);border-radius:var(--ri);padding:10px 12px;font-size:16px}
textarea.inp{resize:none;line-height:1.45}
.inp:focus{border-color:var(--tealt);outline:none}
.check{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--teal)}
.radio{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer}
.radio input{accent-color:var(--teal);width:18px;height:18px;margin:0}
.radio[data-on=true]{border-color:var(--tealt)}
.notice{border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--text2);display:flex;gap:8px;align-items:flex-start}
.notice svg{flex:none;margin-top:2px}
.sim{background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.35);color:var(--text)}
.ph{font-family:inherit;color:var(--amber)}

/* ---------- phone screen pieces ---------- */
.hdr{flex:none;display:flex;align-items:center;gap:4px;padding:10px 12px 4px;min-height:58px}
.hdr h1{font-size:18px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .wmk{font-weight:700;font-size:20px;flex:1;padding-left:8px}
.ib{width:44px;height:44px;border:0;background:none;color:var(--text);border-radius:var(--ri);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib .dot{position:absolute;top:9px;right:9px;min-width:16px;height:16px;border-radius:8px;background:var(--teal);color:#06231f;font-size:11px;font-weight:700;line-height:16px;padding:0 4px}
.bal{font-size:14px;font-weight:600;border:1px solid var(--border2);border-radius:999px;padding:4px 10px;white-space:nowrap;background:none;color:var(--text)}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.main>*{flex-shrink:0}
.foot21{flex:none;padding:6px 16px;text-align:center;font-size:12px;line-height:1.4;color:var(--muted);border-top:1px solid var(--border);background:var(--bg)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--deep);padding:4px 4px 14px}
.tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;min-height:48px}
.tabbar button[aria-current=page]{color:var(--tealt);font-weight:600}
.bar{flex:none;display:flex;gap:10px;padding:10px 20px 12px;border-top:1px solid var(--border);background:var(--deep)}
.seg{display:flex;gap:20px;border-bottom:1px solid var(--border)}
.seg button{border:0;background:none;padding:8px 0;color:var(--muted);border-bottom:2px solid transparent;font-size:15px;min-height:40px}
.seg button[aria-current=true]{color:var(--text);font-weight:600;border-bottom-color:var(--teal)}
.title{font-size:20px;line-height:1.3;font-weight:600}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted)}
.sec{font-size:14px;font-weight:600;color:var(--text2);margin-top:4px}
.banner{flex:none;margin:0 12px 4px;border-radius:var(--ri);padding:8px 10px;font-size:13px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.35);color:var(--text);display:flex;gap:8px;align-items:center}
.banner .btn{margin-left:auto}

/* outcome buttons: blue = first outcome, orange = second, always labelled */
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{display:flex;flex-direction:column;gap:0;text-align:left;border-radius:var(--r);padding:8px 12px;min-height:52px;color:var(--text);border:1.5px solid;background:none}

.out .l2{font-size:12px;color:var(--text2)}
.out.a{border-color:var(--blue);background:rgba(96,165,250,.12)}
.out.b{border-color:var(--orange);background:rgba(251,146,60,.12)}
.out[disabled]{opacity:.45;cursor:not-allowed}
.out.slim{min-height:44px;padding:6px 10px}
.odd{font-variant-numeric:tabular-nums}
.ocolA{color:var(--bluet)} .ocolB{color:var(--oranget)}

.mcard .q{font-weight:600;line-height:1.35;margin:6px 0 10px}
.mcard .foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.sbet{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.sbet .q{font-weight:600}
.sbet .reason{font-size:13px;color:var(--text2)}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheetwrap{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(3,8,16,.62);border:0;width:100%;cursor:default}
.sheet{position:relative;background:var(--bg);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .2s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;padding:6px 8px 0 20px}
.sheet .sh h2{flex:1;font-size:18px;font-weight:600}
.sheet .sb{overflow-y:auto;padding:8px 20px 18px;display:flex;flex-direction:column;gap:12px}
.dialogwrap{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{position:relative;background:var(--bg);border:1px solid var(--border2);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;animation:fade .2s ease}
.dialog h2{font-size:18px;font-weight:600}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet,.dialog{animation:none}}
.toast{position:absolute;left:16px;right:16px;top:64px;z-index:50;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.desk .toast{left:auto;right:24px;top:auto;bottom:24px;width:380px}
.stake{display:flex;align-items:center;gap:8px}
.stake .inp{font-size:20px;font-weight:600;text-align:right}
.quick{display:flex;gap:8px}
.quick button{flex:1}
.moved{border:1px solid rgba(252,211,77,.45);background:rgba(252,211,77,.07);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:14px}
.cmp .h{color:var(--muted);font-size:12px}
.cmp .now{font-weight:700}
.bk{display:flex;flex-direction:column;gap:0}
.bkrow{border-top:1px solid var(--border);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.bkrow:first-child{border-top:0}
.bkrow .q{font-weight:600;grid-column:1/-1}
.bkrow .d{color:var(--text2)}
.totals .kv{font-size:15px}
.totals .net{font-size:20px;font-weight:700}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding-bottom:14px;position:relative}
.timeline li::before{content:'';position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--border)}
.timeline li:last-child::before{display:none}
.timeline .dotc{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1}
.timeline .done .dotc{border-color:var(--tealt);color:var(--tealt)}
.timeline .now .dotc{border-color:var(--amber);color:var(--amber)}
.timeline .k{font-weight:600}
.timeline .s{font-size:13px;color:var(--muted)}
.post{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.post .who{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);flex:none}
.av.lg{width:64px;height:64px;font-size:20px}
.namebtn{border:0;background:none;padding:0;font-weight:600;color:var(--text);font-size:14px}
.ver{display:inline-flex;align-items:center;gap:3px;color:var(--tealt);font-size:12px}
.post .body{font-size:15px;line-height:1.5;white-space:pre-wrap}
.post .acts{display:flex;gap:4px;margin:0 -8px -6px}
.post .acts button{border:0;background:none;color:var(--text2);display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:40px;padding:0 8px;border-radius:var(--ri)}
.post .acts button[aria-pressed=true]{color:var(--tealt)}
.post .acts .more{margin-left:auto}
.mini{border:1px solid var(--border2);border-radius:var(--ri);padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--deep);text-align:left;color:inherit;width:100%}
.mini .mq{font-size:14px;font-weight:600;line-height:1.35}
.mini .ml{font-size:12px;color:var(--text2)}
.removed{font-size:14px;color:var(--muted);font-style:italic}
.comment{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.comment .ct{font-size:14px}
.compose{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--deep)}
.sharecard{border-radius:16px;border:1px solid var(--border2);background:linear-gradient(160deg,#16263d,#0f1b2d);padding:18px;display:flex;flex-direction:column;gap:10px}
.sharecard .wmk{font-weight:700}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:12px 0;border-top:1px solid var(--border);font-size:15px;min-height:52px}
.listbtn:first-child{border-top:0}
.listbtn .sub{display:block;font-size:13px;color:var(--muted)}
.listbtn .chev{margin-left:auto;color:var(--muted)}
.big{font-size:28px;font-weight:700;line-height:1.2}
.okmark{width:48px;height:48px;border-radius:50%;border:2px solid var(--tealt);color:var(--tealt);display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.steps span{flex:1;border-top:3px solid var(--border2);padding-top:4px}
.steps span.on{border-color:var(--teal);color:var(--text)}
.stand{border:1.5px dashed var(--border2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(36,54,79,.25) 10px 20px)}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.chart{display:block}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 8px}

/* ---------- staff console ---------- */
.sapp{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.snav{background:var(--deep);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.snav .wmk{font-weight:700;padding:0 8px 4px}
.snav .who{font-size:12px;color:var(--muted);padding:0 8px 12px}

.tbl td.qcol{min-width:230px}

.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

select.inp{appearance:auto}
.sidebox{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.okline{font-size:13px;color:var(--green);display:flex;gap:6px;align-items:center}
.warnline{font-size:13px;color:var(--amber);display:flex;gap:6px;align-items:center}

/* ---------- decisions board ---------- */
.dec{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.dec h1{font-size:32px;font-weight:700;line-height:1.1}

    if (!stake || stake <= 0) return 0;
    return Math.floor(a > 0 ? (stake * a) / 100 : (stake * 100) / -a);
  },
  decimal(a) { return a > 0 ? 1 + a / 100 : 1 + 100 / -a; },
  implied(a) { return a > 0 ? 100 / (a + 100) : -a / (-a + 100); },
  american(a) { return (a > 0 ? '+' : MINUS) + Math.abs(a); },
  fmt(a, f) {
    if (f === 'decimal') return Odds.decimal(a).toFixed(2);
    if (f === 'implied') return Math.round(Odds.implied(a) * 100) + '%';
    return Odds.american(a);
  },
  tag(a, b) { // Llamado = favourite (negative odds), Dehado = underdog (positive). Equal lines: no label (my choice).

  const h = hoursLeft(iso);

const me = 'ana';
const allMarkets = () => S.d.markets.concat(S.d.past);
const mById = (id) => allMarkets().find((m) => m.id === id);
function findQ(qid) {
  for (const m of allMarkets()) { const q = m.questions.find((x) => x.id === qid); if (q) return { m, q }; }
  return {};
}
const mainQ = (m) => m.questions.find((x) => x.main);
const sideQs = (m) => m.questions.filter((x) => !x.main);

/* status: open | closing | closed | closedEarly | paused | waiting | settled */
function qStatus(q) {
  if (S.paused[q.id]) return 'paused';
  if (q.result !== null && q.result !== undefined) return 'settled';
  if (q.state === 'closedEarly') return 'closedEarly';
  if (q.state === 'waiting') return 'waiting';
  const h = hoursLeft(q.close);
  if (h <= 0) return 'closed';
  return h <= CLOSING_HOURS ? 'closing' : 'open';
}
function marketStatus(m) { return qStatus(mainQ(m)); }
function blockReason() {
  if (S.excluded) return 'Self-exclusion is on. Betting is off.';
  if (S.breakUntil) return `You're on a break until ${when(S.breakUntil)}. Betting and top-ups are paused.`;
  return '';
}
const canBet = (q) => ['open', 'closing'].includes(qStatus(q)) && !blockReason();

/* bet outcome: open | waiting | won | lost | push | void */
function betOutcome(b) {
  const { q } = findQ(b.qid);
  if (!q) return { st: 'open', ret: 0 };
  if (q.result === 'push') return { st: 'push', ret: b.stake };
  if (q.result === 'void') return { st: 'void', ret: b.stake };
  if (q.result === 0 || q.result === 1) {
    return b.pick === q.result ? { st: 'won', ret: b.stake + Odds.toWin(b.stake, b.odds) } : { st: 'lost', ret: 0 };
  }
  const s = qStatus(q);
  return { st: ['open', 'closing', 'paused'].includes(s) ? 'open' : 'waiting', ret: 0 };
}
function betsIn(m) { const ids = m.questions.map((x) => x.id); return S.d.bets.filter((b) => ids.includes(b.qid)); }
function summary(m) {
  const bs = betsIn(m);
  let staked = 0, returned = 0, final = true, any = false;
  for (const b of bs) {
    const o = betOutcome(b); staked += b.stake; returned += o.ret;
    if (o.st === 'open' || o.st === 'waiting') final = false; else any = true;
  }
  return { staked, returned, net: returned - staked, final, anySettled: any, count: bs.length };
}
const inPlay = () => S.d.bets.reduce((t, b) => { const o = betOutcome(b); return t + (o.st === 'open' || o.st === 'waiting' ? b.stake : 0); }, 0);

/* ---- actions that change the demo ---- */
function placeBet(qid, pick, odds, stake) {
  const { m, q } = findQ(qid);
  const b = { id: 'b' + (S.d.bets.length + 100), qid, pick, odds, stake, placed: NOW.toISOString(), mine: true };
  S.d.bets.push(b);
  S.balance -= stake;
  q.pool += stake; q.bettors += 1; q.staked[pick] += stake;
  S.d.history.unshift({ at: NOW.toISOString(), what: `Bet · ${shortTitle(m, q)}, ${q.labels[pick]}`, amt: -stake });
  S.d.people.ana.forecasts += 1;
  S.lastBet = b.id;
  return b;
}
function shortTitle(m, q) {
  const base = { 'bsp-dec': 'BSP Dec 10 meeting', 'cpi-nov': 'PSA November inflation', 'fx-dec4': 'PHP/USD Dec 4', 'fuel-dec8': 'Diesel Dec 8', 'wx-dec15': 'Wind signal Dec 15',
    'bsp-oct': 'BSP Oct 22 meeting', 'cpi-oct': 'PSA October inflation', 'fuel-nov24': 'Diesel Nov 24', 'wx-nov15': 'Wind signal Nov 15' }[m.id] || m.title;
  return q.main ? base : `${base} · ${q.q}`;
}
function moveLine(q, toA) { // automatic line move (rule is an open decision); keeps the other side in step
  const fromA = q.odds[0];
  q.odds = [toA, toA < 0 ? Math.abs(toA) - 20 : -(toA + 20)];
  q.moves24 += 1;
  return fromA;
}
function settleQ(qid, result, note) {
  const { m, q } = findQ(qid);
  q.result = result; q.state = 'settled'; q.resultNote = note || q.resultNote;
  let ret = 0, mine = false;
  for (const b of S.d.bets.filter((x) => x.qid === qid)) { mine = true; ret += betOutcome(b).ret; }
  if (ret) { S.balance += ret; S.d.history.unshift({ at: NOW.toISOString(), what: `Returned · ${shortTitle(m, q)}`, amt: ret }); }
  if (mine) {
    const sm = summary(m);
    S.d.notifications.unshift({ id: 'n' + Date.now(), at: NOW.toISOString(), mid: m.id, read: false,
      text: `Result for “${q.q}” (${shortTitle(m, mainQ(m))}): ${result === 'void' ? 'voided, stake returned' : result === 'push' ? 'push, stake returned' : q.labels[result]}.${sm.final ? ' The market total is now final.' : ''}` });
  }
}
const unread = () => S.d.notifications.filter((x) => !x.read).length;

function statusChip(q, opts = {}) {
  const s = qStatus(q);
  const map = {

    closing: ['closing', 'clock', 'Closing'],
    closed: ['closed', 'lock', 'Closed'],
    closedEarly: ['closed', 'lock', 'Closed early'],
    paused: ['paused', 'pause', 'Paused'],
    waiting: ['waiting', 'wait', 'Waiting for result'],
    settled: ['closed', 'check', 'Settled'],
  };
  const [cls, ic, label] = map[s];
  return `<span class="chip ${cls}">${icon(ic, 12)}${label}</span>`;
}
function closeLine(q) {
  const s = qStatus(q);
  if (s === 'closedEarly') return `Closed early · was set to close ${when(q.close)}`;
  if (s === 'paused') return `Paused by staff · closes ${when(q.close)}`;
  if (s === 'closed' || s === 'waiting' || s === 'settled') return `Closed ${when(q.close)}`;
  return `Closes ${when(q.close)}${s === 'closing' ? ' · ' + leftText(q.close) : ''}`;
}
function oddsTag(q, i) { return Odds.tag(q.odds[i], q.odds[1 - i]); }
/* outcome button: i = 0 (blue, first outcome) or 1 (orange, second) */
function outBtn(q, i, opts = {}) {
  const on = canBet(q);
  const a = q.odds[i];
  const tag = oddsTag(q, i);

  return `<button type="button" class="out ${i ? 'b' : 'a'}${opts.slim ? ' slim' : ''}" ${on ? '' : 'disabled'}
    data-a="slip" data-q="${q.id}" data-i="${i}" aria-label="${esc(q.labels[i])} at ${esc(Odds.fmt(a, S.fmt))}${tag ? ', ' + tag : ''}">
    <span class="l1"><span>${esc(q.labels[i])}</span><span class="odd">${Odds.fmt(a, S.fmt)}</span></span>
    <span class="l2">${sub}</span></button>`;
}
function tplLabel(m) { return TPL[m.tpl]; }
function sampleNote(t = 'Sample values', lines = true) { return `<p class="xs muted">${esc(t)}.${lines ? ' Lines are set automatically from data and move as bets come in.' : ''}</p>`; }
function fmtChipBtn() {
  const lab = { american: 'American', decimal: 'Decimal', implied: 'Implied %' }[S.fmt];
  return `<button type="button" class="pill" data-a="sheet" data-s="fmt" aria-label="Odds format: ${lab}">${icon('gear', 14)}&nbsp;${lab}</button>`;
}
function chart(hist, label) { // first outcome's implied chance from its line, past 7 days
  const W = 350, H = 96;
  const lo = Math.max(0, Math.floor((Math.min(...hist) - 8) / 10) * 10), hi = Math.min(100, Math.ceil((Math.max(...hist) + 8) / 10) * 10);
  const y = (v) => H - 10 - ((v - lo) / (hi - lo)) * (H - 22);
  const pts = hist.map((v, i) => `${(i * (W - 40)) / (hist.length - 1) + 34},${y(v)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg class="chart" role="img" aria-label="${esc(label)}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${[lo, (lo + hi) / 2, hi].map((g) => `<line x1="30" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="#24364f"/><text x="0" y="${y(g) + 4}" font-size="11" fill="#9aa8ba">${g}%</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#60a5fa"/></svg>`;
}
function backBtn() { return `<button type="button" class="ib" data-a="back" aria-label="Back">${icon('back')}</button>`; }
function hdr(title, right = '') { return `<div class="hdr">${backBtn()}<h1>${esc(title)}</h1>${right}</div>`; }
function blockBanner() {
  const r = blockReason();
  if (!r) return '';
  return `<div class="banner" role="status">${icon('pause', 16)}<span>${esc(r)}</span>${S.breakUntil ? '<button type="button" class="btn g sm" data-a="endBreak">End (demo)</button>' : ''}</div>`;
}
function simLabel() { return `<div class="notice sim" role="note">${icon('info', 16)}<span><b>Simulation — no money is charged.</b> Coins are play money: they can’t be bought, cashed out or traded.</span></div>`; }
function resultText(q, r) {
  if (r === 'push') return 'Push';
  if (r === 'void') return 'Void';
  return q.labels[r];
}
const outcomeLabel = { won: 'Won', lost: 'Lost', push: 'Push', void: 'Void', open: 'Open', waiting: 'Waiting for result' };
function outcomeChip(st) {
  const cls = { won: 'neutral', lost: 'neutral', push: 'void', void: 'void', open: 'open', waiting: 'waiting' }[st];
  const ic = { won: 'check', lost: 'x2', push: 'dot', void: 'dot', open: 'dot', waiting: 'wait' }[st];
  return `<span class="chip ${cls}">${icon(ic, 12)}${outcomeLabel[st]}</span>`;
}

  const dr = S.draft; if (!dr.text.trim()) return;
  const myBet = dr.mid ? S.d.bets.filter((b) => findQ(b.qid).m.id === dr.mid).pop() : null;
  S.d.posts.unshift({ id: 'p' + Date.now(), by: me, at: NOW.toISOString(), mid: dr.mid, forecast: myBet ? { qid: myBet.qid, pick: myBet.pick, odds: myBet.odds } : null, text: dr.text.trim(), likes: 0, liked: false, comments: [] });
  S.d.people.ana.posts += 1;
  S.draft = { text: '', mid: null }; S.feedTab = 'latest';
  S.ph.stack = [{ s: 'feed', p: {} }];
  toast('Posted to Community.');
};

/* ---- Resolution queue ---- */
function resQueue() {
  const out = [];
  for (const m of allMarkets()) for (const q of m.questions) {
    if (q.result !== null && q.result !== undefined) continue;
    const s = qStatus(q);
    if (s === 'closedEarly' || s === 'waiting' || s === 'closed') out.push({ m, q });
  }
  return out;
}

// ---- js/shell.js
/* Frames, navigation, rendering and events. */
const TABS = [['markets', 'Markets', 'markets'], ['bets', 'My bets', 'bets'], ['community', 'Community', 'community'], ['wallet', 'Wallet', 'wallet'], ['account', 'Account', 'user']];
const TABROOT = { markets: 'markets', bets: 'bets', community: 'feed', wallet: 'wallet', account: 'account' };
const BANNER = '21+ only · Gambling is addictive. Know when to stop.<span style="display:block">Helpline: [HELPLINE NUMBER]</span>';

const cur = () => S.ph.stack[S.ph.stack.length - 1];
function go(s, p = {}) { S.ph.stack.push({ s, p }); S.ph.sheet = null; S.ph.dialog = null; }
function toast(msg) {
  S.toast = { msg, t: Date.now() };
  const t = S.toast.t;
  setTimeout(() => { if (S.toast && S.toast.t === t) { S.toast = null; render(); } }, 2600);
}
A.go = (d) => go(d.s, d.id ? { id: d.id } : {});
A.back = () => { if (S.ph.dialog) S.ph.dialog = null; else if (S.ph.sheet) S.ph.sheet = null; else if (S.ph.stack.length > 1) S.ph.stack.pop(); };
A.tab = (d) => { S.ph.stack = [{ s: TABROOT[d.t], p: {} }]; S.ph.sheet = null; S.ph.dialog = null; };
A.sheet = (d) => { S.ph.sheet = { s: d.s, p: Object.assign({}, d) }; };
A.closeSheet = () => { S.ph.sheet = null; };
A.dialog = (d) => { S.ph.dialog = { s: d.s, p: Object.assign({}, d) }; };
A.closeDialog = () => { S.ph.dialog = null; };
A.view = (d) => setView(d.v);
A.staff = (d) => { S.st = { s: d.s, p: d.id ? { id: d.id } : {} }; if (S.view !== 'staff') setView('staff'); };
A.reset = () => { const v = S.view, f = S.flow; const fl = FLOWS.find((x) => x.n === f); S = freshState(fl ? fl.persona : 'returning'); S.view = v; S.flow = f; if (fl) fl.steps[0].set(); toast('Demo reset.'); };
A.flow = (d) => startFlow(+d.n);
A.step = (d) => { const f = FLOWS.find((x) => x.n === S.flow); const st = f.steps[+d.i]; st.set(); if (st.frame === 'staff') setView('staff'); else if (S.view !== 'app') setView('app'); };
IN.flowsel = (v) => { S.flow = +v; };

function startFlow(nf) {
  const f = FLOWS.find((x) => x.n === nf);
  if (f.persona && S.persona !== f.persona) { const fmt = S.fmt; S = freshState(f.persona); S.fmt = fmt; }
  S.flow = nf;
  f.steps[0].set();
  setView(f.steps[0].frame === 'staff' ? 'staff' : 'app');
}
function setView(v) {
  S.view = v;
  const name = v === 'app' || v === 'staff' ? (S.flow ? 'flow-' + S.flow : v) : v;
  if (location.hash.slice(1) !== name) { try { history.replaceState(null, '', '#' + name); } catch (e) { /* sandboxed */ } }
}
function fromHash() {
  const h = location.hash.slice(1);
  const m = /^flow-(\d)$/.exec(h);
  if (m && FLOWS.find((x) => x.n === +m[1])) { startFlow(+m[1]); return; }
  if (['start', 'app', 'staff', 'decisions'].includes(h)) S.view = h;
}

/* ---- screen info for the presenter rail and notes ---- */
function curInfo() {
  if (S.view === 'staff') { const d = STAFF[S.st.s]; return { id: d.idFor ? d.idFor(S.st.p) : d.id, title: d.title, tag: d.tag, notes: d.notes, mc: d.mc }; }
  const layer = S.ph.dialog ? [DLG[S.ph.dialog.s], S.ph.dialog.p] : S.ph.sheet ? [SHEET[S.ph.sheet.s], S.ph.sheet.p] : [SCR[cur().s], cur().p];
  const [d, p] = layer;
  return { id: d.idFor ? d.idFor(p || {}) : d.id, title: d.titleFor ? d.titleFor(p || {}) : d.title, tag: d.tag, notes: d.notes || [], mc: d.mc || [] };
}
const TAGTXT = { new: ['new', 'New'], chg: ['chg', 'Changed'], reuse: ['', 'Reused'] };

function renderNotes() {
  const i = curInfo(); const [cls, txt] = TAGTXT[i.tag] || TAGTXT.reuse;
  return `<aside class="notes" aria-label="Screen notes"><div class="sid">Screen ${esc(i.id)}</div><h3>${esc(i.title)}</h3><span class="tag ${cls}">${txt}</span>
    <ul>${i.notes.map((x) => `<li>${esc(x)}</li>`).join('')}${i.mc.map((x) => `<li class="mc">${esc(x)} <i>My choice, needs confirmation.</i></li>`).join('')}</ul></aside>`;
}
function renderRail() {
  const f = FLOWS.find((x) => x.n === S.flow) || FLOWS[1];
  const id = curInfo().id;
  return `<nav class="rail" aria-label="Flow steps"><h2>Flow</h2>
    <select aria-label="Choose a flow" data-in="flowsel">${FLOWS.map((x) => `<option value="${x.n}" ${x.n === f.n ? 'selected' : ''}>${x.n} · ${esc(x.title)}</option>`).join('')}</select>
    <ol>${f.steps.map((s, i) => `<li><button type="button" data-a="step" data-i="${i}" ${s.id === id ? 'aria-current="step"' : ''}><span class="sid">${esc(s.id)}</span><span>${esc(s.label)}</span></button></li>`).join('')}</ol>
    <p class="hint">Click inside the phone as a user would, or jump to a step here. ${f.level === 'static' ? 'This flow may be static in places.' : ''}</p>
    <button type="button" class="btn s sm w" style="margin-top:10px" data-a="flow" data-n="${f.n}">Restart this flow</button></nav>`;
}

    const sd = SHEET[S.ph.sheet.s];
    layer += `<div class="sheetwrap"><button type="button" class="scrim" data-a="closeSheet" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(sd.titleFor ? sd.titleFor() : sd.title)}"><div class="grab"></div>
      <div class="sh"><h2>${esc(sd.titleFor ? sd.titleFor() : sd.title)}</h2><button type="button" class="ib" data-a="closeSheet" aria-label="Close">${icon('close')}</button></div>
      <div class="sb" data-keep="sheet-${S.ph.sheet.s}">${sd.render(S.ph.sheet.p)}</div></div></div>`;
  }
  if (S.ph.dialog) {
    const dd = DLG[S.ph.dialog.s];
    layer += `<div class="dialogwrap"><div class="scrim"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(dd.title)}">${dd.render(S.ph.dialog.p)}</div></div>`;
  }
  const t = S.toast && S.view === 'app' ? `<div class="toast" role="status">${icon('info', 16)}${esc(S.toast.msg)}</div>` : '';
  return `<div class="phone"><div class="screen">${r.hdr || ''}<div class="main" data-keep="${c.s}-${esc(JSON.stringify(c.p || {}))}">${r.main}</div>${r.bar || ''}
    ${def.banner === false ? '' : `<footer class="foot21">${BANNER}</footer>`}${tabbar}${layer}${t}</div></div>`;
}

/* ---- staff ---- */
const SNAV = [['kyc', 'KYC review'], ['lines', 'Lines & exposure'], ['builder', 'Market builder'], ['resolution', 'Resolution queue'], ['moderation', 'Moderation queue'], ['withdrawals', 'Withdrawal approvals'], ['users', 'Users'], ['audit', 'Audit log']];
function renderDesk() {
  const d = STAFF[S.st.s];
  const t = S.toast && S.view === 'staff' ? `<div class="toast" role="status">${icon('info', 16)}${esc(S.toast.msg)}</div>` : '';
  return `<div class="desk" style="position:relative"><div class="deskbar"><i></i><i></i><i></i><span>Tantiya Staff · separate staff app · ${ph('STAFF URL')}</span></div>
    <div class="sapp"><nav class="snav" aria-label="Staff"><div class="wmk">Tantiya Staff</div><div class="who">[REVIEWER 1] · KYC reviewer + admin · two-step sign-in on</div>
      ${SNAV.map(([k, l]) => `<button type="button" data-a="staff" data-s="${k}" ${S.st.s === k ? 'aria-current="page"' : ''}><span>${l}</span>${staffCount(k) ? `<span class="cnt">${staffCount(k)}</span>` : ''}</button>`).join('')}
      <div class="grp">Sample data · English only</div></nav>
      <main class="sbody" data-keep="staff-${S.st.s}">${d.render(S.st.p || {})}</main></div>${t}</div>`;
}

/* ---- top level ---- */
function renderTop() {
  const nav = [['start', 'Start'], ['app', 'User app'], ['staff', 'Staff console'], ['decisions', 'Decisions board']];
  return `<header class="top"><span class="wm">Tantiya<small>Clickable mockup · Dec 1, 2026 review</small></span>
    <nav class="topnav" aria-label="Views">${nav.map(([k, l]) => `<button type="button" data-a="view" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
    <span class="grow"></span><span class="persona">Demo user: ${S.persona === 'new' ? 'new account' : 'Ana S. (sample history)'} · sample values</span>
    <button type="button" class="tb" data-a="reset">Reset demo</button></header>`;
}
function render() {
  const app = document.getElementById('app');
  // keep focus and scroll positions across re-renders
  const ae = document.activeElement; const fid = ae && ae.id; const sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  const scrolls = {}; document.querySelectorAll('[data-keep]').forEach((el) => { scrolls[el.dataset.keep] = el.scrollTop; });
  const winY = window.scrollY;
  let body;
  if (S.view === 'start') body = renderStart();
  else if (S.view === 'decisions') body = renderDecisions();
  else if (S.view === 'staff') body = `<div class="stage staffv"><div class="fitbox"><div class="fit" data-w="1280" data-h="832" data-mode="w"><div class="dev">${renderDesk()}</div></div></div>
      <div class="staffnotes" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px">${renderRail()}${renderNotes()}</div></div>`;
  else body = `<div class="stage">${renderRail()}<div class="fitbox"><div class="fit" data-w="410" data-h="864"><div class="dev">${renderPhone()}</div></div></div>${renderNotes()}</div>`;
  app.innerHTML = renderTop() + body;
  fit();
  document.querySelectorAll('[data-keep]').forEach((el) => { if (scrolls[el.dataset.keep] != null) el.scrollTop = scrolls[el.dataset.keep]; });
  window.scrollTo(0, winY);
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text input */ } } } }
}
function fit() {
  document.querySelectorAll('.fit').forEach((el) => {
    const w = +el.dataset.w, h = +el.dataset.h;
    const availW = el.parentElement.clientWidth;
    const top = el.getBoundingClientRect().top + window.scrollY;
    const availH = Math.max(420, window.innerHeight - Math.min(top, 140) - 16);
    let s = Math.min(1, availW / w);
    if (el.dataset.mode !== 'w') s = Math.min(s, availH / h);
    s = Math.max(0.42, s);
    el.style.width = w * s + 'px'; el.style.height = h * s + 'px';
    el.firstElementChild.style.transform = `scale(${s})`;
  });
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  if (el.tagName === 'A' || el.type === 'submit') e.preventDefault();
  fn(Object.assign({}, el.dataset), el, e);
  render();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-in]');
  if (!el) return;
  IN[el.dataset.in](el.type === 'checkbox' ? el.checked : el.value, el);
  render();
});
document.addEventListener('submit', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.view === 'app' && (S.ph.sheet || S.ph.dialog)) { A.back(); render(); }
});
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { fromHash(); render(); });

S = freshState();
fromHash();
render();

})();
</script>
</body>
</html>
